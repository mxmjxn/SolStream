name: Release

on:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: write
  pull-requests: read

jobs:
  # Continuously updates a draft release as PRs land on main, so when you
  # finally push a tag the notes are pre-built.
  draft-notes:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@v6
        with:
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # When a v* tag is pushed, promote the draft to a real release.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect if this is a pre-release tag
        id: prerelease
        run: |
          if [[ "${GITHUB_REF_NAME}" == *"-rc"* ]] \
             || [[ "${GITHUB_REF_NAME}" == *"-beta"* ]] \
             || [[ "${GITHUB_REF_NAME}" == *"-alpha"* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract release notes for this tag from CHANGELOG.md
        id: notes
        run: |
          # Pull the section of CHANGELOG.md matching this tag's version.
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            /^## \[/ {
              if (in_section) exit
              if ($0 ~ "\\[" ver "\\]") { in_section = 1; next }
            }
            in_section { print }
          ' CHANGELOG.md > /tmp/notes.md
          if [[ ! -s /tmp/notes.md ]]; then
            echo "No CHANGELOG section for ${GITHUB_REF_NAME} — using auto-generated notes."
            echo "use_auto=true" >> "$GITHUB_OUTPUT"
          else
            echo "use_auto=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create / update the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "${{ github.ref_name }}"
          body_path: ${{ steps.notes.outputs.use_auto == 'false' && '/tmp/notes.md' || '' }}
          generate_release_notes: ${{ steps.notes.outputs.use_auto == 'true' }}
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
