---
# SolStream — full installer playbook
#
# Usage:
#   ansible-playbook -i inventory/hosts.yml solstream.yml
#
# Selective application:
#   ansible-playbook -i inventory/hosts.yml solstream.yml --tags nvidia,gamescope
#
# Skip dangerous tasks during development:
#   ansible-playbook -i inventory/hosts.yml solstream.yml --skip-tags reboot

- name: SolStream — headless game-streaming server install
  hosts: solstream_hosts
  become: true
  gather_facts: true

  vars:
    # ────────────── Pinned upstream versions ─────────────────────────────
    # These should NOT be overridden by users under normal operation —
    # they're tested as a set. Bump together via release PRs.
    solstream_gamescope_tag: "3.16.23"
    solstream_wayland_tag: "1.23.1"
    solstream_sunshine_version: "v2025.924.154138"
    solstream_nvidia_branch: "580"

    # NB: user-tunable defaults (solstream_user, resolution, encoder,
    # WireGuard opts) live in group_vars/all.yml — putting them here would
    # silently override what users set in their inventory because play
    # vars beat inventory host_vars in Ansible's precedence.
    #
    # NB: `solstream_skip_preflight` is intentionally undefined — use
    # `| default(false)` in conditionals. Same precedence concern.

  pre_tasks:
    - name: Refuse to run on unsupported OS
      ansible.builtin.fail:
        msg: >
          SolStream v0.1 supports Ubuntu 24.04 only.
          Detected: {{ ansible_distribution }} {{ ansible_distribution_version }}.
          See docs/hardware-support.md for the roadmap.
          Override with -e solstream_skip_preflight=true if you know what you're doing.
      when:
        - not (solstream_skip_preflight | default(false) | bool)
        - not (ansible_distribution == 'Ubuntu' and ansible_distribution_version is version('24.04', '>='))

    - name: Verify NVIDIA GPU present
      ansible.builtin.command: lspci -nn
      register: lspci_out
      changed_when: false
      when: not (solstream_skip_preflight | default(false) | bool)

    - name: Refuse to run without an NVIDIA GPU
      ansible.builtin.fail:
        msg: |
          No NVIDIA GPU detected via lspci. SolStream v0.1 requires an
          NVIDIA Ampere or newer GPU. See docs/hardware-support.md.
          Override with -e solstream_skip_preflight=true to test playbook
          logic on a non-GPU host (won't produce a working install).
      when:
        - not (solstream_skip_preflight | default(false) | bool)
        - "'NVIDIA' not in (lspci_out.stdout | default(''))"

  roles:
    - role: nvidia-driver
      tags: [nvidia, driver]
    - role: kernel-modeset
      tags: [kernel, edid]
    - role: gamescope-build
      tags: [gamescope, build]
    - role: steam
      tags: [steam]
    - role: sunshine
      tags: [sunshine]
    - role: pipewire-session
      tags: [audio, pipewire]
    - role: session-wrapper
      tags: [wrapper, systemd]
    - role: wireguard
      tags: [wireguard, remote]
      when: solstream_enable_wireguard | bool
    - role: discoverability
      tags: [discoverability]
    - role: doctor
      tags: [doctor, never]   # run only with --tags doctor
